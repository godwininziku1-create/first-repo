<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Map: DAJ Plaza, Fort Portal">
  <defs>
    <linearGradient id="sat" x1="0" x2="1">
      <stop offset="0" stop-color="#e6f0df"/>
      <stop offset="0.4" stop-color="#cfe6c9"/>
      <stop offset="1" stop-color="#d8e8d6"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Base (satellite-like) textured shapes -->
  <rect width="100%" height="100%" fill="#f1f6f0"/>
  <g opacity="0.95">
    <rect x="0" y="0" width="1200" height="800" fill="url(#sat)"/>
    <g fill="#bcd9b5" opacity="0.85">
      <ellipse cx="280" cy="220" rx="220" ry="120" />
      <ellipse cx="760" cy="320" rx="300" ry="150" />
      <ellipse cx="520" cy="560" rx="340" ry="160" />
    </g>
    <g fill="#9fbb92" opacity="0.7">
      <path d="M60 600 C120 520,260 520,360 600 C460 680,620 660,760 600 C900 540,1060 560,1140 620 L1140 800 L60 800 Z"/>
    </g>
  </g>

  <!-- Simple roads -->
  <g stroke="#e7f0e5" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M60 160 C200 140,360 140,520 180"/>
    <path d="M420 80 C540 120,700 120,880 160"/>
    <path d="M220 420 C380 360,620 360,820 420"/>
    <path d="M100 700 C320 620,520 620,760 700"/>
  </g>

  <!-- Buildings blocks (DAJ Plaza area) -->
  <g fill="#e9efe6" stroke="#cfe3cd" stroke-width="2.5">
    <rect x="680" y="220" width="140" height="90" rx="6"/>
    <rect x="828" y="236" width="72" height="52" rx="5"/>
    <rect x="640" y="314" width="180" height="62" rx="6"/>
  </g>

  <!-- Pin marker for DAJ Plaza -->
  <g transform="translate(760,260)" filter="url(#shadow)">
    <circle r="34" fill="#2f7a4a" opacity="0.14"/>
    <path d="M0,-44 C14,-44 28,-30 28,-16 C28,4 0,56 0,56 C0,56 -28,4 -28,-16 C-28,-30 -14,-44 0,-44 Z" fill="#2f7a4a"/>
    <circle cy="-18" r="10" fill="#fff"/>
  </g>

  <!-- Arrow + label -->
  <g fill="#2f7a4a">
    <path d="M880 120 L980 80 L974 72 L874 112 Z"/>
    <text x="720" y="330" font-family="Inter, Arial, sans-serif" font-size="28" fill="#123">DAJ Plaza — Rukiidi III Street</text>
  </g>

  <!-- Border rounded -->
  <rect x="6" y="6" width="1188" height="788" rx="10" fill="none" stroke="#e2efe0" stroke-width="12"/>
</svg>
